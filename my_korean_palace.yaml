# my_korean_palace.yaml

# 데이터셋 루트 폴더 경로 (변환된 YOLO 형식 궁궐 데이터셋이 저장된 폴더)
path: C:/Users/herme/forforeigner-microstone-project/AI/yolo_palace_dataset

# 학습 이미지와 검증 이미지 경로 (YOLO_PALACE_OUTPUT_ROOT 폴더 내의 상대 경로)
train: images/train
val: images/val
# test: images/test # 테스트 데이터셋이 있다면 추가

# 클래스 수 (PALACE_BUILDING_NAMES 리스트의 항목 개수)
nc: 158 # prepare_palace_dataset.py 스크립트가 지시한 '158'으로 설정합니다.

# 클래스 이름 (순서 중요! prepare_palace_dataset.py의 PALACE_BUILDING_NAMES와 동일한 순서여야 함)
